<script>
(function () {
  "use strict";
  const URL_ = "https://script.google.com/macros/s/AKfycbxi1yTin_RY9JwCVT4D6f6YJTJUXPiZ3e3NQdVcuhZPtgaHe-Eluts4Ug1xWoD-2Gtmtg/exec";
  const $ = id => document.getElementById(id), esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const post = d => fetch(URL_, { method: "POST", body: JSON.stringify(d), headers: { "Content-Type": "text/plain;charset=utf-8" } }).then(r => r.json());
  const msg = (id, ok, t) => { const m = $(id); m.hidden = false; m.className = "msg " + (ok ? "ok" : "mal"); m.textContent = t; };
  let claveG = ""; try { claveG = localStorage.getItem("valetta.vecino") || ""; } catch (e) {}
  const recordar = c => { try { localStorage.setItem("valetta.vecino", c); } catch (e) {} };
  const ERR = { clave: "La clave no es la de residentes (la misma de Finanzas).", departamento: "Elige tu departamento de la lista.", correo: "Revisa tu correo.", ocupado: "Ese día ya está apartado.", dia: "Elige un día a partir de mañana.", lejos: "Se aparta hasta con 90 días de anticipación.", tope: "Tu departamento ya tiene 2 fechas apartadas.", espera: "Demasiados intentos; prueba en un rato.", "no encontrado": "No encontramos ese folio con ese correo." };
  const deptos = sel => fetch(URL_ + "?accion=vecinos&t=" + Date.now()).then(r => r.json()).then(j => { if (j.ok && j.deptos.length) $(sel).innerHTML = '<option value="">Elige…</option>' + j.deptos.map(d => "<option>" + esc(d) + "</option>").join(""); return j; });
  const q = new URLSearchParams(location.search), DS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"], MS = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const largo = s => { const d = new Date(s + "T12:00:00"); return isNaN(d) ? s : DS[d.getDay()] + " " + d.getDate() + " de " + MS[d.getMonth()]; };
  const pon = (ic, t, sub) => { $("r").innerHTML = '<div style="font-size:3.2rem">' + ic + '</div><h1 style="font-size:1.5rem;margin:.3rem 0">' + esc(t) + '</h1><p class="sub" style="margin:0">' + sub + "</p>"; };
  if (q.get("accion") !== "resolverCasa") { pon("🤔", "Liga incompleta", "Usa el botón del correo."); return; }
  fetch(URL_ + "?" + q.toString()).then(r => r.json()).then(j => {
    if (j.ok) pon(j.estatus === "Confirmada" ? "✅" : "❌", (j.estatus === "Confirmada" ? "Confirmada" : "Rechazada") + " · " + j.folio, "Depto <b>" + esc(j.depto) + "</b> · " + esc(largo(j.dia)) + "<br>Al residente ya le llegó el aviso por correo.");
    else pon("⚠️", { liga: "La liga no es válida", cancelada: "El residente la canceló", ocupado: "Ese día ya está confirmado para otro depto", "no encontrado": "No encontré el folio" }[j.error] || "No se pudo", j.error === "cancelada" ? "La fecha quedó libre." : "Revisa la pestaña «Reservas casa club» de la hoja.");
  }).catch(() => pon("📡", "Sin conexión", "Intenta de nuevo en un momento."));
})();
</script>
